[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pdd_stat"
version = "1.0.0"
description = "PDD_STAT — медицинский статистический анализатор"
requires-python = ">=3.11"
dependencies = [
    "tabulate",
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "openpyxl",
    "jinja2",
    "matplotlib",
    "numpy",
    "python-multipart",
    "lifelines",
    "scikit-learn",
    "statsmodels",
    "shap",
    "scikit-survival",
    "scipy",
    "seaborn",
    "python-docx",
    "httpx",
    "pyarrow",
    "autograd",
    "autograd-gamma",
    "pyyaml",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    "E402",
    "B008",
    "B904",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
